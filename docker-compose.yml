services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fatec
      POSTGRES_PASSWORD: fatec
      POSTGRES_DB: fatec
    ports:
      - '5432:5432'
    volumes:
      - fatec_postgres_data:/var/lib/postgresql/data

volumes:
  fatec_postgres_data:
